# Development database only. MTPanel itself is NOT meant to run in Docker in
# production: it manages host systemd units, tc and iptables and therefore runs
# directly on the Ubuntu host (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
